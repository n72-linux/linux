%YAML 1.2
---
$id: http://devicetree.org/schemas/mtd/apple,s5l8720-fmss.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple S5L8720 FMSS NAND flash controller

maintainers:
  - Kailash <kailash.sudhakar@gmail.com>

properties:
  compatible:
    const: apple,s5l8720-fmss

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    minItems: 1
    maxItems: 2
    description: Clocks, all enabled together.

  apple,ce-bitmap:
    $ref: /schemas/types.yaml#/definitions/uint32
    default: 3
    description: Bitmap of populated chip enables.

  apple,page-size:
    $ref: /schemas/types.yaml#/definitions/uint32
    default: 8192
    description:
      Page size in bytes; the driver rejects values it cannot split into its
      chunks.

  apple,read-setup-clks:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Read timing setup value, in clocks.

  apple,read-hold-clks:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Read timing hold value, in clocks.

  apple,read-dccycle-clks:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Read timing DC cycle value, in clocks.

  apple,expected-readid:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Chip ID the driver expects to read; see the driver.

  apple,blocks-per-ce:
    $ref: /schemas/types.yaml#/definitions/uint32
    default: 4148
    description: Blocks per chip enable.

  apple,pages-per-block:
    $ref: /schemas/types.yaml#/definitions/uint32
    default: 128
    description: Pages per block.

required:
  - compatible
  - reg
  - interrupts
  - clocks

additionalProperties: false

examples:
  - |
    flash-controller@38a00000 {
        compatible = "apple,s5l8720-fmss";
        reg = <0x38a00000 0x1000>;
        interrupt-parent = <&vic1>;
        interrupts = <22>;
        clocks = <&clkgate 0 5>, <&clkgate 0 9>;
        apple,ce-bitmap = <3>;
        apple,read-setup-clks = <1>;
        apple,read-hold-clks = <1>;
        apple,read-dccycle-clks = <2>;
        apple,page-size = <8192>;
        apple,expected-readid = <0x3294d798>;
    };
