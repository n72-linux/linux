%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/apple,s5l8720-clock-gates.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple S5L8720 clock gates

maintainers:
  - Kailash <kailash.sudhakar@gmail.com>

description:
  Clock gates of the S5L8720. A clock is selected by two cells, the index of
  the gate register (0 to 4, registers 0x48, 0x4c, 0x58, 0x68 and 0x6c) and
  the bit within it. Cell <3 5> controls the grouped MBX GPU gate bits (bits
  5-7 of 0x68) atomically; <3 6> and <3 7> are rejected. The gates share their
  parent clock, the first entry of "clocks".

properties:
  compatible:
    const: apple,s5l8720-clock-gates

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  "#clock-cells":
    const: 2

  apple,gates-off:
    $ref: /schemas/types.yaml#/definitions/uint32-matrix
    description:
      List of <register-index bit> pairs naming gates to close at boot.
    items:
      items:
        - description: gate register index
        - description: bit in the gate register

required:
  - compatible
  - reg
  - clocks
  - "#clock-cells"

additionalProperties: false

examples:
  - |
    clock-controller@3c500000 {
        compatible = "apple,s5l8720-clock-gates";
        reg = <0x3c500000 0x100>;
        clocks = <&nclk>;
        #clock-cells = <2>;
        apple,gates-off = <0 3>, <0 4>, <1 17>;
    };
