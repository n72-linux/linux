%YAML 1.2
---
$id: http://devicetree.org/schemas/timer/samsung,s5l8720-timer.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S5L8720 timer

maintainers:
  - Kailash <kailash.sudhakar@gmail.com>

description:
  The S5L8720 timer block. Its free-running 64-bit counter (TIMER64) is the
  clocksource and sched_clock; timer E is the clock event device. The
  block's clock gate must already be open; the binding has no clocks.

properties:
  compatible:
    const: samsung,s5l8720-timer

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1
    description: Timer E.

  clock-frequency:
    description:
      Rate of the 64-bit counter. Without it the driver assumes the 2 MHz of
      the iPod nanos; on the iPod touch 2G it runs at 12 MHz.

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false

examples:
  - |
    timer@3c700000 {
        compatible = "samsung,s5l8720-timer";
        reg = <0x3c700000 0x20000>;
        clock-frequency = <12000000>;
        interrupts = <7>;
    };
