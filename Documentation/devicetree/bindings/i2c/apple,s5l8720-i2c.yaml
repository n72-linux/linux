%YAML 1.2
---
$id: http://devicetree.org/schemas/i2c/apple,s5l8720-i2c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S5L8702 / Apple S5L8720 I2C controller

maintainers:
  - Kailash <kailash.sudhakar@gmail.com>

allOf:
  - $ref: /schemas/i2c/i2c-controller.yaml#

properties:
  compatible:
    oneOf:
      - const: samsung,s5l8702-i2c
      - items:
          - const: apple,s5l8720-i2c
          - const: samsung,s5l8702-i2c

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1
    description:
      Optional; without it the controller is polled.

  clocks:
    minItems: 1
    maxItems: 2
    description: Clocks, all enabled together while a transfer runs.

  clock-frequency:
    description: Bus clock frequency in Hz (up to 400000 Fast-Mode on apple,s5l8720-i2c).

  samsung,write-busy-poll:
    type: boolean
    description: See the driver.

required:
  - compatible
  - reg
  - clocks

unevaluatedProperties: false

examples:
  - |
    i2c@3c900000 {
        compatible = "apple,s5l8720-i2c", "samsung,s5l8702-i2c";
        #address-cells = <1>;
        #size-cells = <0>;
        reg = <0x3c900000 0x100>;
        interrupts = <22>;
        clock-frequency = <400000>;
        clocks = <&clkgate 1 6>, <&clkgate 4 12>;
    };
