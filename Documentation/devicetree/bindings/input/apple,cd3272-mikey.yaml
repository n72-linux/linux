%YAML 1.2
---
$id: http://devicetree.org/schemas/input/apple,cd3272-mikey.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple CD3272 "Mikey" headset remote and microphone switch

maintainers:
  - Kailash <kailash.sudhakar@gmail.com>

properties:
  compatible:
    const: apple,cd3272-mikey

  reg:
    maxItems: 1

  hp-det-gpios:
    maxItems: 1
    description: Optional headphone detect GPIO.

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        mikey@39 {
            compatible = "apple,cd3272-mikey";
            reg = <0x39>;
            hp-det-gpios = <&pmu 2 GPIO_ACTIVE_HIGH>;
        };
    };
