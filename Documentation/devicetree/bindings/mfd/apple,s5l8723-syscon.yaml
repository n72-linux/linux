%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/apple,s5l8723-syscon.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple S5L87xx watchdog system controller

maintainers:
  - Kailash <kailash.sudhakar@gmail.com>

description:
  The watchdog registers of the S5L8720 and S5L8723. A syscon-reboot child
  resets the SoC by writing the control register; on the S5L8720 a watchdog
  child runs the timer itself.

properties:
  compatible:
    items:
      - const: apple,s5l8723-syscon
      - const: syscon
      - const: simple-mfd

  reg:
    maxItems: 1

  watchdog:
    $ref: /schemas/watchdog/apple,s5l8720-wdt.yaml#

patternProperties:
  "^syscon-reboot(@[0-9a-f]+)?$":
    $ref: /schemas/power/reset/syscon-reboot.yaml#
    unevaluatedProperties: false

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    syscon@3c800000 {
        compatible = "apple,s5l8723-syscon", "syscon", "simple-mfd";
        reg = <0x3c800000 0x8>;

        syscon-reboot {
            compatible = "syscon-reboot";
            offset = <0x0>;
            value = <0x100000>;
        };

        watchdog {
            compatible = "apple,s5l8720-wdt";
            clock-frequency = <133000000>;
        };
    };
