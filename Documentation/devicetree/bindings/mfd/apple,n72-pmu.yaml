%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/apple,n72-pmu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple iPod touch 2G (N72) power management unit

maintainers:
  - Kailash <kailash.sudhakar@gmail.com>

description: |
  I2C power management unit of the N72: backlight, power-off, RTC, battery
  and USB power supplies, GPIOs, LDO regulators and the SoC core rail. The
  GPIO controller is registered only when "gpio-controller" is present.

properties:
  compatible:
    const: apple,n72-pmu

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  system-power-controller: true

  monitored-battery:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: simple-battery node used for the battery capacity table.

  gpio-controller: true

  "#gpio-cells":
    const: 2

  interrupt-controller: true

  "#interrupt-cells":
    const: 2

  regulators:
    type: object
    description:
      LDO regulators and DOWN0; only those described here can be switched
      or set.

    properties:
      down0:
        type: object
        $ref: /schemas/regulator/regulator.yaml#
        unevaluatedProperties: false
        description:
          DOWN0, the buck converter of the SoC core rail, 725 mV to 1500 mV
          in steps of 25 mV. It has no enable control and is always on.

    patternProperties:
      "^ldo[0-9]+$":
        type: object
        $ref: /schemas/regulator/regulator.yaml#
        unevaluatedProperties: false

    additionalProperties: false

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        pmic@73 {
            compatible = "apple,n72-pmu";
            reg = <0x73>;
            interrupts-extended = <&gpio 0x61 IRQ_TYPE_LEVEL_LOW>;
            system-power-controller;
            monitored-battery = <&battery>;
            gpio-controller;
            #gpio-cells = <2>;
            interrupt-controller;
            #interrupt-cells = <2>;

            regulators {
                down0 {
                    regulator-name = "core";
                    regulator-min-microvolt = <725000>;
                    regulator-max-microvolt = <1500000>;
                    regulator-always-on;
                    regulator-boot-on;
                };

                ldo3 {
                    regulator-name = "touch";
                    regulator-min-microvolt = <1800000>;
                    regulator-max-microvolt = <1800000>;
                    regulator-always-on;
                };

                ldo4 {
                    regulator-name = "lcd";
                    regulator-min-microvolt = <3000000>;
                    regulator-max-microvolt = <3000000>;
                    regulator-boot-on;
                };
            };
        };
    };
