%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/apple,s5l8720-otgphy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple S5L8720 USB OTG PHY

maintainers:
  - Kailash <kailash.sudhakar@gmail.com>

description:
  The USB 2.0 PHY of the S5L8720's DesignWare OTG controller. The driver
  keeps the tuning registers the boot loader programmed and writes them
  back on every power on. It takes no clocks or resets; the PHY's clock gate
  is left as the boot loader opened it.

properties:
  compatible:
    const: apple,s5l8720-otgphy

  reg:
    maxItems: 1

  "#phy-cells":
    const: 0

required:
  - compatible
  - reg
  - "#phy-cells"

additionalProperties: false

examples:
  - |
    usbphy: usbphy@3c400000 {
        compatible = "apple,s5l8720-otgphy";
        reg = <0x3c400000 0x100>;
        #phy-cells = <0>;
    };
