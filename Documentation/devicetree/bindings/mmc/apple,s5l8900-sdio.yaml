%YAML 1.2
---
$id: http://devicetree.org/schemas/mmc/apple,s5l8900-sdio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple S5L8900 / S5L8720 SDIO host controller

maintainers:
  - Kailash <kailash.sudhakar@gmail.com>

allOf:
  - $ref: mmc-controller.yaml#

properties:
  compatible:
    oneOf:
      - const: apple,s5l8900-sdio
      - items:
          - const: apple,s5l8720-sdio
          - const: apple,s5l8900-sdio

  reg:
    minItems: 1
    items:
      - description: controller registers
      - description: clock gate register, used when there is no clock

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-frequency: true

  apple,gate-mask:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Required when the second "reg" entry is given.

required:
  - compatible
  - reg
  - interrupts

unevaluatedProperties: false

examples:
  - |
    mmc@38d00000 {
        compatible = "apple,s5l8720-sdio", "apple,s5l8900-sdio";
        reg = <0x38d00000 0x1000>;
        clocks = <&clkgate 0 8>;
        clock-frequency = <51200000>;
        interrupt-parent = <&vic1>;
        interrupts = <10>;
        bus-width = <4>;
        max-frequency = <25600000>;
        non-removable;
        cap-sdio-irq;
        keep-power-in-suspend;
        mmc-pwrseq = <&wifi_pwrseq>;
        vmmc-supply = <&wlbt_power>;
    };
