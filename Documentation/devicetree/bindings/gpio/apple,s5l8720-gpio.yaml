%YAML 1.2
---
$id: http://devicetree.org/schemas/gpio/apple,s5l8720-gpio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple S5L8720 pinctrl, GPIO, and GPIO interrupt controller

maintainers:
  - Kailash <kailash.sudhakar@gmail.com>

properties:
  compatible:
    oneOf:
      - items:
          - const: apple,s5l8720-pinctrl
          - const: apple,s5l8720-gpio
      - const: apple,s5l8720-pinctrl
      - const: apple,s5l8720-gpio

  reg:
    minItems: 1
    items:
      - description: GPIO banks
      - description: GPIO interrupt controller (optional)

  interrupts:
    minItems: 1
    maxItems: 7
    description:
      One interrupt per group of 32 GPIO interrupts; the interrupt controller
      is registered only when the second "reg" entry is present.

  gpio-controller: true

  "#gpio-cells":
    const: 2

  gpio-ranges: true

  interrupt-controller: true

  "#interrupt-cells":
    const: 2

  pinctrl-names: true
  pinctrl-0: true

  apple,pin-functions:
    $ref: /schemas/types.yaml#/definitions/uint32-matrix
    description:
      Legacy fallback list of <pin function> pairs naming pads to be put in a
      peripheral function when child pinmux nodes are not used.
    items:
      items:
        - description: GPIO number
        - description: pad function

patternProperties:
  "-pins$":
    type: object
    description: Pinmux configuration group using APPLE_PINMUX(pin, func).
    properties:
      pinmux:
        $ref: /schemas/types.yaml#/definitions/uint32-array
    required:
      - pinmux
    additionalProperties: false

required:
  - compatible
  - reg
  - gpio-controller
  - "#gpio-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/pinctrl/apple.h>

    pinctrl@3cf00000 {
        compatible = "apple,s5l8720-pinctrl", "apple,s5l8720-gpio";
        reg = <0x3cf00000 0x200>, <0x39700000 0x1000>;
        gpio-controller;
        #gpio-cells = <2>;
        gpio-ranges = <&gpio 0 0 120>;
        interrupt-controller;
        #interrupt-cells = <2>;
        interrupts-extended = <&vic1 1>, <&vic1 0>, <&vic0 31>,
                              <&vic0 3>, <&vic0 2>;
        pinctrl-names = "default";
        pinctrl-0 = <&i2s0_mclk_hog>;

        i2s0_mclk_hog: i2s0-mclk-pins {
            pinmux = <APPLE_PINMUX(6, 2)>;
        };

        uart1_pins: uart1-pins {
            pinmux = <APPLE_PINMUX(79, 2)>,
                     <APPLE_PINMUX(80, 2)>;
        };
    };
