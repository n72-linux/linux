%YAML 1.2
---
$id: http://devicetree.org/schemas/media/apple,s5l8720-h264.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple S5L8720 H.264 decoder

maintainers:
  - Kailash <kailash.sudhakar@gmail.com>

properties:
  compatible:
    const: apple,s5l8720-h264

  reg:
    minItems: 1
    items:
      - description: decoder registers
      - description: reset block register (optional)

  interrupts:
    maxItems: 1

  clocks:
    minItems: 1
    maxItems: 3
    description: Clocks, all enabled together, parent first.

required:
  - compatible
  - reg
  - interrupts
  - clocks

additionalProperties: false

examples:
  - |
    video-codec@38f00000 {
        compatible = "apple,s5l8720-h264";
        reg = <0x38f00000 0x4000>, <0x3e000000 0x10>;
        interrupt-parent = <&vic1>;
        interrupts = <3>;
        clocks = <&clkgate 1 21>, <&clkgate 3 2>, <&clkgate 4 18>;
    };
