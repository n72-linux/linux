%YAML 1.2
---
$id: http://devicetree.org/schemas/media/apple,s5l8720-mpvd.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple S5L8720 MPEG-4 Part 2 / H.263 decoder

maintainers:
  - Kailash <kailash.sudhakar@gmail.com>

properties:
  compatible:
    const: apple,s5l8720-mpvd

  reg:
    minItems: 7
    maxItems: 7
    description:
      Register blocks of the six decoder units in the order DDM, MP4, VLD, IQ,
      IMC, MI (the driver's unit array), followed by the reset block.

  interrupts:
    maxItems: 1

  clocks:
    minItems: 1
    maxItems: 2
    description: Clocks, all enabled together.

required:
  - compatible
  - reg
  - interrupts
  - clocks

additionalProperties: false

examples:
  - |
    video-codec@39600000 {
        compatible = "apple,s5l8720-mpvd";
        reg = <0x39600000 0x1000>, <0x39610000 0x1000>,
              <0x39630000 0x1000>, <0x39641000 0x1000>,
              <0x39650000 0x1000>, <0x39660000 0x1000>,
              <0x3e000000 0x10>;
        interrupt-parent = <&vic1>;
        interrupts = <13>;
        clocks = <&clkgate 1 21>, <&clkgate 3 3>;
    };
