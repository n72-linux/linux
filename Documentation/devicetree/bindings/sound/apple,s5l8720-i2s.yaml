%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/apple,s5l8720-i2s.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple S5L8720 I2S controller

maintainers:
  - Kailash <kailash.sudhakar@gmail.com>

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    const: apple,s5l8720-i2s

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: the I2S block's gate
      - description: the gate iOS calls DMACM

  clock-names:
    items:
      - const: i2s
      - const: dmacm

  dmas:
    maxItems: 2

  dma-names:
    items:
      - const: tx
      - const: rx

  "#sound-dai-cells":
    const: 0

required:
  - compatible
  - reg
  - "#sound-dai-cells"

unevaluatedProperties: false

examples:
  - |
    i2s@3ca00000 {
        compatible = "apple,s5l8720-i2s";
        reg = <0x3ca00000 0x1000>;
        interrupt-parent = <&vic1>;
        interrupts = <12>;
        clocks = <&clkgate 1 7>, <&clkgate 3 8>;
        clock-names = "i2s", "dmacm";
        dmas = <&dmac0 10 2>, <&dmac0 11 2>;
        dma-names = "tx", "rx";
        #sound-dai-cells = <0>;
    };
