%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/cirrus,cs42l58.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Cirrus Logic CS42L58 audio codec

maintainers:
  - Kailash <kailash.sudhakar@gmail.com>

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    const: cirrus,cs42l58

  reg:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  "#sound-dai-cells":
    const: 0

required:
  - compatible
  - reg
  - reset-gpios
  - "#sound-dai-cells"

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        audio-codec@4a {
            compatible = "cirrus,cs42l58";
            reg = <0x4a>;
            reset-gpios = <&gpio 72 GPIO_ACTIVE_LOW>;
            #sound-dai-cells = <0>;
        };
    };
