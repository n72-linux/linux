%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/ti,lm48821.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Texas Instruments LM48821 speaker amplifier

maintainers:
  - Kailash <kailash.sudhakar@gmail.com>

properties:
  compatible:
    const: ti,lm48821

  reg:
    maxItems: 1

  enable-gpios:
    maxItems: 1

required:
  - compatible
  - reg
  - enable-gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        amplifier@76 {
            compatible = "ti,lm48821";
            reg = <0x76>;
            enable-gpios = <&gpio 114 GPIO_ACTIVE_LOW>;
        };
    };
